[package]
name = "surfacecraft"
description = "SurfaceCraft desktop application"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
surfacecraft-ui-egui.workspace = true
# The AccessKit tree: without this feature the window exposes nothing to a screen reader. eframe's
# defaults include it, but the workspace turns the defaults off (docs/STATUS.md, accessibility).
eframe = { workspace = true, features = ["accesskit"] }
craft-window.workspace = true
egui.workspace = true

[lints]
workspace = true

# Product metadata for installers (docs/distribution.md). The bundle id is reverse-DNS of the
# owner's domain (pawlus.dev); the version comes from the workspace.
[package.metadata.surfacecraft]
product-name = "SurfaceCraft"
bundle-id = "dev.pawlus.surfacecraft"
binary = "surfacecraft"
cli-binary = "surfacecraft-cli"
