[package]
name = "surfacecraft-web"
description = "SurfaceCraft in the browser (wasm32, WebGPU with WebGL2 fallback)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
surfacecraft-ui-egui.workspace = true
eframe.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
surfacecraft-geom.workspace = true
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement", "Element", "Location", "Navigator", "console"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
getrandom = { workspace = true, features = ["wasm_js"] }

# The thread pool of the threaded bundle (`cargo xtask web`): rayon's workers are web workers that
# share the wasm memory. Only built with `+atomics`; the stable wasm check has no threads.
# `web_spin_lock` lets the page's thread, which may not block, hand work to the pool.
[target.'cfg(all(target_arch = "wasm32", target_feature = "atomics"))'.dependencies]
rayon = { workspace = true, features = ["web_spin_lock"] }

[lints]
workspace = true
