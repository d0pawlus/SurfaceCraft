[package]
name = "surfacecraft-ui-egui"
description = "SurfaceCraft L5: the egui front end (desktop and web): panels, command palette, wgpu viewport"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
surfacecraft-geom.workspace = true
surfacecraft-fit.workspace = true
surfacecraft-doc.workspace = true
surfacecraft-engine.workspace = true
surfacecraft-ai.workspace = true
serde_json.workspace = true
egui.workspace = true
eframe.workspace = true
egui-wgpu.workspace = true
wgpu.workspace = true
bytemuck.workspace = true
log.workspace = true
png = "0.18"
serde.workspace = true
craft-ui.workspace = true
egui_extras.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster.workspace = true
craft-dialogs.workspace = true
getrandom.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
rfd.workspace = true
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlAnchorElement", "Blob", "Url"] }

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["wgpu"] }
surfacecraft-kernel.workspace = true
surfacecraft-ai.workspace = true

[lints]
workspace = true
