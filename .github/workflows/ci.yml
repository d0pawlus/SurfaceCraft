name: ci

on:
  push:
    branches: [main]
  pull_request:
    # ready_for_review: marking a draft ready starts the full suite (see the note on the jobs)
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # A pull request that only changes documentation skips the heavy steps below; the jobs still
  # run and report, so they can stay required checks. docs/guides/*.md are compiled into the
  # engine (include_str!), so they count as code. A push to main always runs everything.
  changes:
    name: detect docs-only change
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: diff
        if: github.event_name == 'pull_request'
        run: |
          # HEAD is the merge commit of the pull request; its first parent is the base branch
          files=$(git diff --name-only HEAD^1 HEAD)
          echo "$files"
          code=$(echo "$files" | grep -Ev '(\.md$|^docs/)' || true)
          guides=$(echo "$files" | grep -E '^docs/guides/' || true)
          if [ -n "$files" ] && [ -z "$code" ] && [ -z "$guides" ]; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

  # Two speeds. A DRAFT pull request gets the fast jobs only: `gate` (static checks, clippy,
  # wasm check) and `changed-tests` (the unit tests of the crates it changes and the
  # integration tests whose files it changes, on Linux, Windows and macOS), about a quarter of
  # an hour. Marking the pull request ready, a push to a ready pull request and a push to main
  # run the full suite below on the three systems, its tests split into parts that run at the
  # same time. Work in a draft, mark it ready when the fast jobs are green, merge only with the
  # full suite green.
  gate:
    name: fast gate (static checks, clippy, wasm)
    needs: changes
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.draft == true && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for eframe/rfd
        continue-on-error: true
        timeout-minutes: 5
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          apt_get() { sudo timeout 120 apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 "$@"; }
          apt_get update || echo "::warning::apt-get update failed or timed out"
          apt_get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev \
            || echo "::warning::system libraries not installed; using the runner image as it is"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: static-Linux
          cache-all-crates: true
          save-if: false
      - name: cargo xtask quick (static checks)
        run: cargo xtask quick
      - name: cargo xtask clippy
        run: cargo xtask clippy
      - name: cargo xtask wasm
        run: cargo xtask wasm

  changed-tests:
    name: changed tests (${{ matrix.os }})
    needs: changes
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.draft == true && needs.changes.outputs.docs_only != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Select the tests of what changed
        id: select
        shell: bash
        run: |
          # HEAD is the merge commit of the pull request; its first parent is the base branch.
          # One line per test target: "<package><TAB><cargo argument>".
          set -euo pipefail
          plan="$RUNNER_TEMP/plan.txt"
          : > "$plan.raw"
          pkg_of() { sed -n 's/^name = "\(.*\)"$/\1/p' "$1/Cargo.toml" | head -n 1; }
          git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/files.txt"
          while IFS= read -r f; do
            root=$(echo "$f" | cut -d/ -f1-2)
            if [ ! -f "$root/Cargo.toml" ]; then continue; fi
            case "$f" in
              crates/*/src/*|apps/*/src/*)
                # unit tests of a changed crate
                if [ -f "$root/src/lib.rs" ]; then printf '%s\t--lib\n' "$(pkg_of "$root")" >> "$plan.raw"; fi ;;
              crates/*/tests/*|apps/*/tests/*)
                rest=${f#"$root"/tests/}
                case "$rest" in
                  */*)
                    # a shared module of the integration tests: every test file that declares it
                    dir=${rest%%/*}
                    for t in "$root"/tests/*.rs; do
                      if grep -qE "^[[:space:]]*(pub )?mod $dir;" "$t"; then
                        printf '%s\t--test %s\n' "$(pkg_of "$root")" "$(basename "$t" .rs)" >> "$plan.raw"
                      fi
                    done ;;
                  *.rs)
                    if [ -f "$f" ]; then printf '%s\t--test %s\n' "$(pkg_of "$root")" "${rest%.rs}" >> "$plan.raw"; fi ;;
                esac ;;
            esac
          done < "$RUNNER_TEMP/files.txt"
          sort -u "$plan.raw" > "$plan"
          cat "$plan"
          if [ -s "$plan" ]; then echo "any=true" >> "$GITHUB_OUTPUT"; else echo "any=false" >> "$GITHUB_OUTPUT"; fi
      - name: System libraries for eframe/rfd
        if: steps.select.outputs.any == 'true' && runner.os == 'Linux'
        continue-on-error: true
        timeout-minutes: 5
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          apt_get() { sudo timeout 120 apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 "$@"; }
          apt_get update || echo "::warning::apt-get update failed or timed out"
          apt_get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev \
            || echo "::warning::system libraries not installed; using the runner image as it is"
      - uses: dtolnay/rust-toolchain@stable
        if: steps.select.outputs.any == 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.select.outputs.any == 'true'
        with:
          # the cache the full suite of main writes for this system
          shared-key: full-${{ runner.os }}
          cache-all-crates: true
          save-if: false
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        if: steps.select.outputs.any == 'true'
        with:
          tool: cargo-nextest
      - name: Run them
        if: steps.select.outputs.any == 'true'
        shell: bash
        run: |
          set -euo pipefail
          plan="$RUNNER_TEMP/plan.txt"
          failed=0
          for pkg in $(cut -f1 "$plan" | sort -u); do
            args=$(awk -F'\t' -v p="$pkg" '$1 == p { printf "%s ", $2 }' "$plan")
            echo "::group::$pkg: $args"
            # shellcheck disable=SC2086
            cargo nextest run --cargo-profile ci --no-fail-fast --no-tests=pass -p "$pkg" $args || failed=1
            echo "::endgroup::"
          done
          exit "$failed"
      - name: Nothing to run (no crate or test file changed)
        if: steps.select.outputs.any != 'true'
        run: echo "no crate or test file changed"

  # The full suite is `cargo xtask ci` split over machines that run at the same time: this job runs
  # its static checks, clippy and the wasm check; the `tests` jobs below run its tests in parts.
  ci:
    name: static checks, clippy, wasm
    needs: changes
    # runs even when detection failed: only an explicit docs_only == 'true' skips steps;
    # not for a draft pull request (the fast jobs above run instead)
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for eframe/rfd
        if: env.DOCS_ONLY != 'true'
        # Best effort: when the Ubuntu package mirrors are unreachable (2026-11-11: every Linux job
        # sat here until its time limit) the job goes on with what the runner image has, and the
        # build says so itself if a library is really missing.
        continue-on-error: true
        timeout-minutes: 5
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          apt_get() { sudo timeout 120 apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 "$@"; }
          apt_get update || echo "::warning::apt-get update failed or timed out"
          apt_get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev \
            || echo "::warning::system libraries not installed; using the runner image as it is"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        if: env.DOCS_ONLY != 'true'
        with:
          # clippy and the wasm check, shared with the fast gate; pull requests restore the cache of
          # main and never write their own, so the cache quota is not churned by every branch
          shared-key: static-Linux
          cache-all-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo xtask quick (static checks)
        if: env.DOCS_ONLY != 'true'
        run: cargo xtask quick
      - name: cargo xtask clippy
        if: env.DOCS_ONLY != 'true'
        run: cargo xtask clippy
      - name: cargo xtask wasm
        if: env.DOCS_ONLY != 'true'
        run: cargo xtask wasm
      - name: cargo xtask assets (documentation-only change)
        if: env.DOCS_ONLY == 'true'
        run: cargo xtask assets

  # The tests of the full suite on the three systems, each split into parts that run at the same
  # time (`cargo xtask test --partition balanced:K/N`: every test runs in exactly one part, part 1
  # also runs the doc tests; the heaviest tests, listed with their measured time in
  # xtask/src/heavy_tests.rs, are spread over the parts by time, the rest by count, because equal
  # numbers of tests gave parts of 22 and 46 minutes). macOS is here because the work is done on macOS and results differ
  # between the systems' math libraries: a test that passes on one of the three has failed on
  # another more than once. The number of parts follows the measured times (2026-11-15, one
  # part: Windows 68 min of tests, Linux 48, macOS 45); a public repository pays nothing for the
  # extra machines, but more parts mean more jobs waiting for a runner when many pull requests
  # are ready at once.
  tests:
    name: tests (${{ matrix.name }} ${{ matrix.part }}/${{ matrix.parts }})
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux, os: ubuntu-latest, part: 1, parts: 2 }
          - { name: linux, os: ubuntu-latest, part: 2, parts: 2 }
          - { name: windows, os: windows-latest, part: 1, parts: 3 }
          - { name: windows, os: windows-latest, part: 2, parts: 3 }
          - { name: windows, os: windows-latest, part: 3, parts: 3 }
          - { name: macos, os: macos-latest, part: 1, parts: 2 }
          - { name: macos, os: macos-latest, part: 2, parts: 2 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        if: env.DOCS_ONLY != 'true'
      - name: System libraries for eframe/rfd
        if: env.DOCS_ONLY != 'true' && runner.os == 'Linux'
        continue-on-error: true
        timeout-minutes: 5
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          apt_get() { sudo timeout 120 apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 "$@"; }
          apt_get update || echo "::warning::apt-get update failed or timed out"
          apt_get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev \
            || echo "::warning::system libraries not installed; using the runner image as it is"
      - uses: dtolnay/rust-toolchain@stable
        if: env.DOCS_ONLY != 'true'
      - uses: Swatinem/rust-cache@v2
        if: env.DOCS_ONLY != 'true'
        with:
          # one cache per system, shared with the fast `changed-tests`; every part builds the same
          # test binaries, so only part 1 of a push to main writes it
          shared-key: full-${{ runner.os }}
          cache-all-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.part == 1 }}
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        if: env.DOCS_ONLY != 'true'
        with:
          tool: cargo-nextest
      - name: cargo xtask test (part ${{ matrix.part }} of ${{ matrix.parts }})
        if: env.DOCS_ONLY != 'true'
        run: cargo xtask test --partition balanced:${{ matrix.part }}/${{ matrix.parts }}
      - name: Nothing to test (documentation-only change)
        if: env.DOCS_ONLY == 'true'
        run: echo "documentation-only change"

  # The browser bundle with threads is built on a pinned nightly with shared memory, and some
  # code exists only there (the worker pool, the allocator, the `atomics` paths). This job
  # type-checks exactly that configuration, so a break shows on the pull request instead of at
  # the deploy. A check, not a build: no code generation, no wasm-bindgen.
  web-threads:
    name: web bundle with threads (type check)
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        if: env.DOCS_ONLY != 'true'
      - uses: dtolnay/rust-toolchain@stable
        if: env.DOCS_ONLY != 'true'
      - uses: Swatinem/rust-cache@v2
        if: env.DOCS_ONLY != 'true'
        with:
          key: web-threads
          cache-all-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Nightly of the threaded web build (pinned in xtask/src/web.rs)
        if: env.DOCS_ONLY != 'true'
        run: rustup toolchain install "$(cargo xtask web-toolchain)" --profile minimal --component rust-src
      - name: cargo xtask web --check
        if: env.DOCS_ONLY != 'true'
        run: cargo xtask web --check
      - name: Nothing to check (documentation-only change)
        if: env.DOCS_ONLY == 'true'
        run: echo "documentation-only change"

  deny:
    name: cargo deny (sources, bans, licences)
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        if: env.DOCS_ONLY != 'true'
        with:
          command: check sources bans licenses
