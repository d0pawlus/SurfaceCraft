name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  ci:
    name: cargo xtask ci
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for eframe/rfd
        # Best effort: when the Ubuntu package mirrors are unreachable (2026-11-11: every Linux job
        # sat here until its time limit) the job goes on with what the runner image has, and the
        # build says so itself if a library is really missing.
        continue-on-error: true
        timeout-minutes: 5
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          apt_get() { sudo timeout 120 apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 "$@"; }
          apt_get update || echo "::warning::apt-get update failed or timed out"
          apt_get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev \
            || echo "::warning::system libraries not installed; using the runner image as it is"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true
      - name: cargo xtask ci
        run: cargo xtask ci

  windows-tests:
    name: tests (windows)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo xtask test
        run: cargo xtask test

  deny:
    name: cargo deny (sources, bans, licences)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check sources bans licenses
