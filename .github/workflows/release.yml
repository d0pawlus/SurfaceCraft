name: release

# Builds unsigned release packages for Windows, Linux and macOS and attaches them, with one combined
# SHA256SUMS.txt, to a GitHub Release. The package names follow the Craft launcher's asset convention
# (docs/distribution.md, "Release assets"). No secret is used: GITHUB_TOKEN creates the release.
# Code signing is not done yet.
#
# Two kinds of release:
# - official: only by hand — the owner pushes a tag `v*` or starts the workflow with an existing tag;
# - nightly: once a day at 04:00 Warsaw time, from the head of main, published as the pre-release
#   `nightly` (replaced every night). Skipped when main has not changed since the last nightly or when
#   `ci` did not pass on that commit. Merges to main never publish anything by themselves.

on:
  push:
    tags: ['v*']
  schedule:
    # GitHub cron is UTC; 04:00 in Warsaw is 02:00 UTC in summer and 03:00 UTC in winter. Both run,
    # and the prepare job keeps the one that falls on 04:00 local time.
    - cron: '0 2 * * *'
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release, e.g. v0.1.0 (must match the workspace version), or "nightly"'
        required: true
        type: string

concurrency:
  group: release-${{ github.event_name == 'schedule' && 'nightly' || (github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name) }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  prepare:
    name: check the tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      ref: ${{ steps.tag.outputs.ref }}
      nightly: ${{ steps.tag.outputs.nightly }}
      build: ${{ steps.tag.outputs.build }}
    steps:
      - id: tag
        name: check the tag name (or decide whether tonight's nightly runs)
        env:
          RAW_TAG: ${{ github.event_name == 'schedule' && 'nightly' || (github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name) }}
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="$RAW_TAG"
          if [[ "$tag" != "nightly" ]]; then
            if [[ ${#tag} -gt 64 || ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::'$tag' is not a release tag (vX.Y.Z or vX.Y.Z-pre) nor 'nightly'"
              exit 1
            fi
            { echo "tag=$tag"; echo "ref=refs/tags/$tag"; echo "nightly=false"; echo "build=true"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          { echo "tag=nightly"; echo "nightly=true"; } >> "$GITHUB_OUTPUT"
          if [[ "$EVENT" == "schedule" && "$(TZ=Europe/Warsaw date +%H)" != "04" ]]; then
            echo "Not 04:00 in Warsaw (the other of the two UTC crons); no nightly."
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sha=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
          echo "ref=$sha" >> "$GITHUB_OUTPUT"
          last=$(gh api "repos/$GH_REPO/git/ref/tags/nightly" --jq .object.sha 2>/dev/null || true)
          if [[ "$EVENT" == "schedule" && "$last" == "$sha" ]]; then
            echo "main ($sha) has not changed since the last nightly; skipping."
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ci=$(gh run list --workflow ci.yml --branch main --commit "$sha" --json conclusion --jq '.[0].conclusion // ""')
          if [[ "$ci" != "success" ]]; then
            echo "::warning::ci has not passed on main ($sha, conclusion '${ci:-none}'); no nightly tonight."
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "build=true" >> "$GITHUB_OUTPUT"

  package:
    name: package (${{ matrix.target }})
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - name: System libraries for eframe/rfd
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}
          cache-all-crates: true
      - name: cargo xtask dist (release binaries and packages)
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        # a nightly carries the workspace version in its file names; only official tags are checked
        run: |
          if [[ "$TAG" == "nightly" ]]; then cargo xtask dist; else cargo xtask dist --tag "$TAG"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/${{ matrix.target }}/release/
          if-no-files-found: error

  release:
    name: publish the release
    needs: [prepare, package]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      REF: ${{ needs.prepare.outputs.ref }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: downloads
      - name: merge the checksums and check every package
        run: |
          set -euo pipefail
          mkdir assets
          : > all-sums.txt
          for dir in downloads/release-*/; do
            if [[ ! -f "${dir}SHA256SUMS.txt" ]]; then
              echo "::error::${dir} has no SHA256SUMS.txt"
              exit 1
            fi
            for file in "$dir"*; do
              if [[ "$(basename "$file")" != "SHA256SUMS.txt" ]]; then
                cp "$file" assets/
              fi
            done
            cat "${dir}SHA256SUMS.txt" >> all-sums.txt
          done
          sort -k2 all-sums.txt > assets/SHA256SUMS.txt
          rm all-sums.txt
          cd assets
          if [[ -n "$(awk '{ print $2 }' SHA256SUMS.txt | sort | uniq -d)" ]]; then
            echo "::error::a file name appears twice in SHA256SUMS.txt"
            exit 1
          fi
          if [[ "$(wc -l < SHA256SUMS.txt)" -ne "$(find . -type f ! -name SHA256SUMS.txt | wc -l)" ]]; then
            echo "::error::SHA256SUMS.txt does not list exactly the packages"
            exit 1
          fi
          sha256sum --check SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: write the release notes
        run: |
          set -euo pipefail
          {
            if [[ "$TAG" == "nightly" ]]; then
              printf '# SurfaceCraft nightly, %s\n\n' "$(TZ=Europe/Warsaw date +%F)"
              printf 'Automatic build of main at %s. Not an official release: it is replaced every night.\n\n' "$REF"
            else
              printf '# SurfaceCraft %s\n\n' "$TAG"
            fi
            cat <<'NOTES'
          These builds are not code-signed yet. Windows SmartScreen warns about an unknown publisher, and
          macOS Gatekeeper blocks the app until it is opened on purpose (right-click, Open, or System
          Settings > Privacy & Security). Check each download against SHA256SUMS.txt.

          The macOS build is for Apple silicon only. Intel Macs are not built yet.

          ## Files

          NOTES
            awk '{ print "- `" $2 "`" }' assets/SHA256SUMS.txt
          } > notes.md
      - name: create the GitHub release
        run: |
          set -euo pipefail
          if [[ "$TAG" == "nightly" ]]; then
            # replace last night's pre-release and move the tag to the commit just built
            gh release delete nightly --cleanup-tag --yes 2>/dev/null || true
            gh api "repos/$GH_REPO/git/refs/tags/nightly" -X DELETE 2>/dev/null || true
            gh release create nightly --target "$REF" --prerelease --latest=false \
              --title "SurfaceCraft nightly $(TZ=Europe/Warsaw date +%F)" --notes-file notes.md assets/*
            exit 0
          fi
          flags=()
          case "$TAG" in
            *-*) flags+=(--prerelease) ;;
          esac
          gh release create "$TAG" --title "SurfaceCraft $TAG" --notes-file notes.md --verify-tag "${flags[@]}" assets/*
