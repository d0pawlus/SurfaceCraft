# TEMPORARY: same-commit comparison of test runners and linkers; removed before this pull request is ready.
name: bench

on:
  pull_request:

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  bench:
    name: ${{ matrix.variant }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { variant: linux-nextest, cache: linux-nextest, os: ubuntu-latest }
          - { variant: linux-nextest-o2, cache: linux-nextest, os: ubuntu-latest, opt: 2 }
          - { variant: windows-nextest, cache: windows-nextest, os: windows-latest }
          - { variant: windows-nextest-lld, cache: windows-nextest, os: windows-latest, lld: true }
          - { variant: windows-nextest-o2, cache: windows-nextest, os: windows-latest, opt: 2 }
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for eframe/rfd
        if: runner.os == 'Linux'
        continue-on-error: true
        timeout-minutes: 5
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          apt_get() { sudo timeout 120 apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 "$@"; }
          apt_get update || true
          apt_get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev || true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true
          key: ${{ matrix.cache }}
          save-if: false
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-nextest
      # set after the cache step so that the cache key (which hashes CARGO_* variables) stays the same
      - name: Link with rust-lld
        if: matrix.lld
        shell: bash
        run: echo "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=rust-lld" >> "$GITHUB_ENV"
      - name: Workspace opt-level
        if: matrix.opt
        shell: bash
        run: echo "CARGO_PROFILE_CI_OPT_LEVEL=${{ matrix.opt }}" >> "$GITHUB_ENV"
      - name: cargo xtask test
        run: cargo xtask test
