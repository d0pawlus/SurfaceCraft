# TEMPORARY: same-commit comparison of test runners and linkers; removed before this pull request is ready.
name: bench

on:
  pull_request:

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  bench:
    name: ${{ matrix.variant }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { variant: linux-cargo-test, os: ubuntu-latest, nextest: false, mold: false }
          - { variant: linux-nextest, os: ubuntu-latest, nextest: true, mold: false }
          - { variant: linux-nextest-mold, os: ubuntu-latest, nextest: true, mold: true }
          - { variant: windows-cargo-test, os: windows-latest, nextest: false, mold: false }
          - { variant: windows-nextest, os: windows-latest, nextest: true, mold: false }
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for eframe/rfd
        if: runner.os == 'Linux'
        continue-on-error: true
        timeout-minutes: 5
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          apt_get() { sudo timeout 120 apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 "$@"; }
          apt_get update || true
          apt_get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev || true
      - uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1
        if: matrix.mold
        with:
          make-default: false
      - name: Link with mold
        if: matrix.mold
        run: echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS=-C linker-features=-lld -C link-arg=-fuse-ld=mold" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true
          key: ${{ matrix.variant }}
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        if: matrix.nextest
        with:
          tool: cargo-nextest
      - name: cargo xtask test
        run: cargo xtask test
      - name: Which linker
        if: runner.os == 'Linux'
        run: readelf -p .comment "$(ls target/ci/deps/commands-* | grep -v '\.d$' | head -1)"
