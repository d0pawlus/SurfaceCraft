# TEMPORARY: same-commit comparison of test runners and linkers; removed before this pull request is ready.
name: bench

on:
  pull_request:

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  bench:
    name: ${{ matrix.os }}-o${{ matrix.opt }}-${{ matrix.replica }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        opt: [1, 2, 3]
        replica: [a, b]
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for eframe/rfd
        if: runner.os == 'Linux'
        continue-on-error: true
        timeout-minutes: 5
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          apt_get() { sudo timeout 120 apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 "$@"; }
          apt_get update || true
          apt_get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev || true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true
          key: ${{ runner.os == 'Linux' && 'linux-nextest' || 'windows-nextest' }}
          save-if: false
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-nextest
      # set after the cache step so that the cache key (which hashes CARGO_* variables) stays the same
      - name: Workspace opt-level and CPU model
        shell: bash
        run: |
          (grep -m1 "model name" /proc/cpuinfo || wmic cpu get name || powershell -c "(Get-CimInstance Win32_Processor).Name") 2>/dev/null | sed 's/^/CPU: /'
          echo "CARGO_PROFILE_CI_OPT_LEVEL=${{ matrix.opt }}" >> "$GITHUB_ENV"
      - name: cargo xtask test
        run: cargo xtask test
