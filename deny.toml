# Licences are also checked by `cargo xtask licences --check` (allowlist, no GPL/LGPL/AGPL).
[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib",
  "Unicode-3.0", "Unicode-DFS-2016", "CC0-1.0", "BSL-1.0", "OFL-1.1", "Ubuntu-font-1.0", "CDLA-Permissive-2.0", "0BSD", "MIT-0", "BlueOak-1.0.0"]
confidence-threshold = 0.9

[advisories]
yanked = "warn"

[bans]
multiple-versions = "warn"
wildcards = "warn"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# solidcore, pinned by rev in Cargo.toml (design doc §9). Only crates/kernel uses it.
# craft-libs (ArtCraft family UI: craft-ui, craft-window, craft-dialogs), pinned by rev; UI layer only
# (owner's decision 2026-11-09, docs/superpowers/plans/2026-11-09-p6-gui.md).
allow-git = ["https://github.com/tangency-labs/solidcore", "https://github.com/storytold/craft-libs"]
